<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppFacts label</title>
  <meta name="description" content="Portable AppFacts nutrition label — decoded from the URL fragment." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #101418;
      --paper: #f8fafc;
      --mute: #5c6b7a;
      --ember: #d96b2b;
      --font-display: "Sora", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-mono);
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 15% -10%, rgba(217, 107, 43, 0.16), transparent 55%),
        linear-gradient(180deg, #0c1015 0%, #101418 45%, #0a0e13 100%);
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem 2.5rem;
    }
    .shell { width: min(100%, 28rem); }
    .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f0a36a;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 0.85rem;
    }
    .brand span { color: #fff; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0 0 0.75rem;
    }
    .toolbar button {
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      color: #e8eef5;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .toolbar button:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .toolbar button[aria-pressed="true"] {
      border-color: var(--ember);
      color: #f0a36a;
    }
    .toolbar .ico { width: 0.9rem; height: 0.9rem; display: inline-block; }
    .toast {
      font-size: 0.68rem;
      color: #9fe3b8;
      min-height: 1rem;
      margin: 0 0 0.55rem;
    }
    .stage { perspective: 1200px; }
    .card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 480ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card.is-flipped { transform: rotateY(180deg); }
    .face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .face-raw {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      overflow: auto;
    }
    .card.is-flipped .face-label { pointer-events: none; }
    .card:not(.is-flipped) .face-raw { pointer-events: none; }
    .label, .raw-panel {
      background: var(--paper);
      color: var(--ink);
      border: 4px solid var(--ink);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      padding: 1rem 1.05rem 1.15rem;
      min-height: 100%;
    }
    .label { animation: rise 500ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .label h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.55rem, 5vw, 1.9rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0;
      text-transform: uppercase;
    }
    .serving {
      font-size: 0.72rem;
      border-bottom: 10px solid var(--ink);
      padding: 0.4rem 0 0.5rem;
      margin-bottom: 0.35rem;
      color: var(--mute);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      border-bottom: 5px solid var(--ink);
      padding: 0.45rem 0 0.55rem;
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
    }
    .meta strong { font-weight: 600; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--ink);
      padding: 0.32rem 0;
      font-size: 0.8rem;
    }
    .row.thick { border-bottom-width: 5px; }
    .section {
      margin-top: 0.7rem;
      font-size: 0.72rem;
      color: var(--mute);
    }
    .section b {
      display: block;
      color: var(--ink);
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
    }
    .deps { margin: 0; padding-left: 1.1rem; }
    .deps li { margin: 0.15rem 0; }
    .deps code {
      font-family: inherit;
      font-weight: 600;
      color: var(--ink);
    }
    .links {
      margin-top: 0.85rem;
      padding-top: 0.65rem;
      border-top: 1px solid #c5ced8;
      font-size: 0.72rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    .links a { color: var(--ember); }
    .links .ext { color: var(--mute); }
    .links .host { color: var(--mute); font-weight: 400; }
    .raw-panel h2 {
      font-family: var(--font-display);
      font-size: 0.95rem;
      margin: 0 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .raw-note {
      font-size: 0.68rem;
      color: var(--mute);
      margin: 0 0 0.55rem;
    }
    .raw-panel pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.68rem;
      line-height: 1.45;
      max-height: min(70vh, 36rem);
      overflow: auto;
    }
    .trust {
      margin: 0 0 0.75rem;
      padding: 0.55rem 0.7rem;
      font-size: 0.68rem;
      line-height: 1.4;
      color: #c9d3de;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .msg {
      color: #dce5ef;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 1.1rem;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .msg a { color: #f0a36a; }
    .msg code {
      font-size: 0.78rem;
      word-break: break-all;
    }
    @media (prefers-reduced-motion: reduce) {
      .label { animation: none; }
      .card { transition: none; }
      .card.is-flipped { transform: none; }
      .face-raw {
        position: static;
        transform: none;
        display: none;
      }
      .card.is-flipped .face-label { display: none; }
      .card.is-flipped .face-raw { display: block; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <a class="brand" href="/">App<span>Facts</span></a>
    <div id="app"></div>
  </div>
  <script>
    const PREFIX = "af1.";
    const BRAND = "AppFacts";

    function b64urlToBytes(b64url) {
      const padded = b64url.replace(/-/g, "+").replace(/_/g, "/")
        + "===".slice((b64url.length + 3) % 4);
      const bin = atob(padded);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function inflateBytes(bytes) {
      if (typeof DecompressionStream === "undefined") {
        throw new Error("This browser cannot decode AppFacts payloads (needs DecompressionStream).");
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
      const buf = await new Response(stream).arrayBuffer();
      return new TextDecoder().decode(buf);
    }

    async function decodeHash(hash) {
      const raw = (hash || "").replace(/^#/, "");
      if (!raw) {
        throw new Error("Missing AppFacts payload. Generate APP_FACTS.png with a recent generator, then scan it.");
      }
      const ver = raw.match(/^(af\d+)\./i);
      if (!ver) {
        throw new Error("Missing AppFacts payload. Generate APP_FACTS.png with a recent generator, then scan it.");
      }
      if (ver[1].toLowerCase() !== "af1") {
        throw new Error(
          `Label format ${ver[1]} is not supported — update your viewer. This page understands af1 only.`
        );
      }
      const json = await inflateBytes(b64urlToBytes(raw.slice(PREFIX.length)));
      const data = JSON.parse(json);
      if (!data || data.v !== 1 || !data.name) throw new Error("Unrecognized or incomplete payload.");
      return data;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function safeHttpUrl(raw) {
      if (raw == null || typeof raw !== "string") return null;
      const trimmed = raw.trim();
      let u;
      try { u = new URL(trimmed); } catch { return null; }
      if (u.protocol !== "http:" && u.protocol !== "https:") return null;
      if (trimmed.length > 2048) return null;
      return u.href;
    }

    function hostLabel(href) {
      try { return new URL(href).hostname.replace(/^www\./, ""); }
      catch { return ""; }
    }

    const KNOWN_REPO_HOSTS = [
      "github.com", "gitlab.com", "bitbucket.org", "codeberg.org",
      "git.sr.ht", "sourceforge.net", "dev.azure.com", "gitea.com",
    ];
    function isKnownRepoHost(href) {
      let host;
      try { host = new URL(href).hostname.replace(/^www\./, "").toLowerCase(); }
      catch { return false; }
      return KNOWN_REPO_HOSTS.some((h) => host === h || host.endsWith("." + h));
    }

    const LABEL_ACRONYMS = new Set([
      "AI", "CI", "CD", "API", "DB", "UI", "UX", "URL", "CLI", "SDK", "QA",
      "CSS", "HTML", "SSR", "SPA", "ORM", "CDN", "DNS", "TLS", "HTTP", "HTTPS",
      "IDE", "OS", "VM", "PWA", "GPU", "CPU", "ID", "IO", "JSON", "YAML", "XML",
      "SQL", "PHP", "SEO", "CMS", "LLM",
    ]);

    function titleCase(s) {
      return String(s).replace(/_/g, " ").split(/\s+/).map((w) => {
        if (!w) return w;
        const up = w.toUpperCase();
        if (LABEL_ACRONYMS.has(up)) return up;
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(" ");
    }

    function yamlScalar(v) {
      if (v == null) return "null";
      if (typeof v === "boolean" || typeof v === "number") return String(v);
      const s = String(v);
      if (s === "") return '""';
      if (/^[\w.+/@:-]+$/.test(s) && !/^(true|false|null|yes|no)$/i.test(s)) return s;
      return JSON.stringify(s);
    }

    function yamlMap(obj, indent) {
      const pad = "  ".repeat(indent);
      return Object.entries(obj || {}).map(([k, v]) => {
        if (v != null && typeof v === "object" && !Array.isArray(v)) {
          return `${pad}${k}:\n${yamlMap(v, indent + 1)}`;
        }
        if (Array.isArray(v)) {
          if (!v.length) return `${pad}${k}: []`;
          const items = v.map((item) => {
            if (item != null && typeof item === "object") {
              const inner = Object.entries(item).map(([ik, iv], idx) =>
                idx === 0
                  ? `${pad}  - ${ik}: ${yamlScalar(iv)}`
                  : `${pad}    ${ik}: ${yamlScalar(iv)}`
              ).join("\n");
              return inner;
            }
            return `${pad}  - ${yamlScalar(item)}`;
          }).join("\n");
          return `${pad}${k}:\n${items}`;
        }
        return `${pad}${k}: ${yamlScalar(v)}`;
      }).join("\n");
    }

    function reconstructRaw(data) {
      if (typeof data.raw === "string" && data.raw.trim()) return data.raw;
      const fm = {
        app_facts_version: "0.1.0",
        name: data.name,
        type: data.type,
        status: data.status,
        license: data.license,
        stack: data.stack || {},
      };
      if (Array.isArray(data.deps)) {
        fm.key_dependencies = data.deps.map((d) => {
          const row = { name: d && d.n };
          if (d && d.p) row.purpose = d.p;
          return row;
        });
      }
      if (Array.isArray(data.svc) && data.svc.length) {
        fm.services = data.svc.map((s) => ({ name: s && s.n, role: s && s.r }));
      }
      if (data.build && Object.keys(data.build).length) fm.build = data.build;
      if (data.homepage) fm.homepage = data.homepage;
      if (data.repository) fm.repository = data.repository;
      const body = [
        `# ${data.name}`,
        `\`${data.type}\` · **${data.status}** · ${data.license}`,
        "",
        "Reconstructed from the portable viewer payload. Prefer the repo `APP_FACTS.md` when available.",
      ];
      if (data.truncated) body.push("", "> Portable payload was truncated to fit a shareable URL.");
      return `---\n${yamlMap(fm, 0)}\n---\n\n${body.join("\n")}\n`;
    }

    function renderLabelFace(data) {
      const stack = Object.entries(data.stack || {});
      const deps = Array.isArray(data.deps) ? data.deps.slice(0, 12) : [];
      const services = Array.isArray(data.svc) ? data.svc.slice(0, 8) : [];
      const build = Object.entries(data.build || {}).slice(0, 12);
      const stackHtml = stack.slice(0, 16).map(([k, v], i, arr) => {
        const thick = i === arr.length - 1 ? " thick" : "";
        return `<div class="row${thick}"><strong>${esc(titleCase(k))}</strong><span>${esc(v)}</span></div>`;
      }).join("");
      const depsHtml = deps.length
        ? `<ul class="deps">${deps.map((d) =>
            `<li><code>${esc(d && d.n)}</code>${d && d.p ? ` — ${esc(d.p)}` : ""}</li>`
          ).join("")}</ul>`
        : `<div class="row">None listed</div>`;
      const servicesHtml = services.length
        ? `<div class="section"><b>Services</b><ul class="deps">${services.map((s) =>
            `<li><strong>${esc(s && s.n)}</strong>${s && s.r ? ` — ${esc(s.r)}` : ""}</li>`
          ).join("")}</ul></div>`
        : "";
      const buildHtml = build.length
        ? `<div class="section"><b>Build</b>${build.map(([k, v]) =>
            `<div class="row"><strong>${esc(titleCase(k))}</strong><span>${esc(v)}</span></div>`
          ).join("")}</div>`
        : "";

      const links = [];
      const repo = safeHttpUrl(data.repository);
      if (repo && isKnownRepoHost(repo)) {
        links.push(
          `<a href="${esc(repo)}" rel="noopener noreferrer nofollow" referrerpolicy="no-referrer" target="_blank">Repository <span class="host">(${esc(hostLabel(repo))})</span></a>`
        );
      } else if (repo) {
        links.push(`<span class="ext">Repository: ${esc(hostLabel(repo))} <span class="host">(not a known code host — not linked)</span></span>`);
      }
      const home = safeHttpUrl(data.homepage);
      if (home) {
        links.push(`<span class="ext">Homepage: ${esc(hostLabel(home))} <span class="host">(shown as text, not linked)</span></span>`);
      }
      links.push(`<a href="/">What is AppFacts?</a>`);

      return `<article class="label" aria-label="App Facts for ${esc(data.name)}">
        <h1>${esc(String(data.name).slice(0, 120))}</h1>
        <div class="serving">Serving size: one repository · Read time: under a minute</div>
        <div class="meta">
          <span><strong>Type</strong> ${esc(String(data.type ?? "").slice(0, 80))}</span>
          <span><strong>Status</strong> ${esc(String(data.status ?? "").slice(0, 40))}</span>
          <span><strong>License</strong> ${esc(String(data.license ?? "").slice(0, 40))}</span>
        </div>
        ${stackHtml}
        <div class="section"><b>Key dependencies</b>${depsHtml}</div>
        ${servicesHtml}
        ${buildHtml}
        <div class="links">${links.join("")}</div>
      </article>`;
    }

    function renderError(err) {
      return `<div class="msg">
        <p><strong>Could not show this label.</strong></p>
        <p>${esc(err.message || err)}</p>
        <p>Expected a URL like <code>https://appfacts.dev/v#af1.…</code> from a generated <code>APP_FACTS.png</code>.</p>
        <p><a href="/">Back to AppFacts</a></p>
      </div>`;
    }

    function faceFromQuery() {
      try {
        return new URLSearchParams(location.search).get("face") === "raw" ? "raw" : "label";
      } catch {
        return "label";
      }
    }

    function setFaceQuery(face) {
      const url = new URL(location.href);
      if (face === "raw") url.searchParams.set("face", "raw");
      else url.searchParams.delete("face");
      history.replaceState(null, "", url.pathname + url.search + url.hash);
    }

    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    function iconFlip() {
      return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a6.5 6.5 0 1 0 6.3 8.1h-1.55A5 5 0 1 1 8 3v2.25L11.5 2.75 8 .25V1.5zm0 13a6.5 6.5 0 0 0 0-13v1.5a5 5 0 1 1 0 10V16z"/></svg>`;
    }
    function iconCopy() {
      return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 2h7a1 1 0 0 1 1 1v8h-1.5V3.5H6V2zm-2.5 3H10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm.5 1.5v7h6v-7H4z"/></svg>`;
    }
    function iconLink() {
      return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.3 9.7a2.75 2.75 0 0 1 0-3.9l1.6-1.6a2.75 2.75 0 0 1 3.9 3.9l-.7.7-.95-.95.7-.7a1.4 1.4 0 1 0-2-2l-1.6 1.6a1.4 1.4 0 0 0 0 2l.45.45-.95.95-.45-.45zm3.4-3.4a2.75 2.75 0 0 1 0 3.9l-1.6 1.6a2.75 2.75 0 0 1-3.9-3.9l.7-.7.95.95-.7.7a1.4 1.4 0 1 0 2 2l1.6-1.6a1.4 1.4 0 0 0 0-2l-.45-.45.95-.95.45.45z"/></svg>`;
    }

    function mountViewer(data) {
      const root = document.getElementById("app");
      const rawText = reconstructRaw(data);
      let face = faceFromQuery();

      root.innerHTML = `
        <p class="trust">Untrusted label payload from the URL — not verified by ${esc(BRAND)}. Treat all text as user-controlled. Only repository links to known code hosts are clickable; homepages are shown as text, never linked.</p>
        <div class="toolbar" role="toolbar" aria-label="Label controls">
          <button type="button" id="btn-flip" aria-pressed="${face === "raw"}">${iconFlip()}<span id="flip-label">${face === "raw" ? "Show label" : "Flip to raw"}</span></button>
          <button type="button" id="btn-copy">${iconCopy()}<span>Copy raw</span></button>
          <button type="button" id="btn-link">${iconLink()}<span>Copy link</span></button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
        <div class="stage">
          <div class="card${face === "raw" ? " is-flipped" : ""}" id="card">
            <div class="face face-label">${renderLabelFace(data)}</div>
            <div class="face face-raw">
              <div class="raw-panel">
                <h2>Raw label</h2>
                <p class="raw-note">${data.raw ? "Embedded source from the portable payload." : "Reconstructed from the compact payload (body may differ from a hand-authored file)."}${data.truncated ? " Payload was truncated for URL size." : ""}</p>
                <pre id="raw-pre"></pre>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById("raw-pre").textContent = rawText;

      const card = document.getElementById("card");
      const flipBtn = document.getElementById("btn-flip");
      const flipLabel = document.getElementById("flip-label");
      const toast = document.getElementById("toast");

      function applyFace(next) {
        face = next;
        card.classList.toggle("is-flipped", face === "raw");
        flipBtn.setAttribute("aria-pressed", face === "raw" ? "true" : "false");
        flipLabel.textContent = face === "raw" ? "Show label" : "Flip to raw";
        setFaceQuery(face);
      }

      flipBtn.addEventListener("click", () => applyFace(face === "raw" ? "label" : "raw"));
      document.getElementById("btn-copy").addEventListener("click", async () => {
        try {
          await copyText(rawText);
          toast.textContent = "Raw label copied.";
        } catch {
          toast.textContent = "Could not copy.";
        }
      });
      document.getElementById("btn-link").addEventListener("click", async () => {
        try {
          await copyText(location.href);
          toast.textContent = "Link copied.";
        } catch {
          toast.textContent = "Could not copy link.";
        }
      });
    }

    (async () => {
      const root = document.getElementById("app");
      try {
        if (!location.hash || location.hash === "#") {
          root.innerHTML = renderError(new Error("No payload in the URL hash yet."));
          return;
        }
        const data = await decodeHash(location.hash);
        document.title = `AppFacts — ${data.name}`;
        mountViewer(data);
      } catch (err) {
        root.innerHTML = renderError(err);
      }
    })();
  </script>
</body>
</html>
